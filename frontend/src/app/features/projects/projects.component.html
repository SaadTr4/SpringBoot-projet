<div class="page-wrapper">

  <!-- Header interne -->
  <div class="glass-card welcome-card">
    <div class="welcome-left">
      <div>
        <h2 class="welcome-title">Liste des projets</h2>
        <p class="welcome-sub">Connecté en tant que {{ username }}</p>
      </div>
    </div>
    <button class="welcome-logout" (click)="openModal('add')">+ Ajouter</button>
  </div>

  <!-- Tableau -->
  <div class="glass-card table-card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Nom du projet</th>
        <th>Chef de projet</th>
        <th>Statut</th>
        <th>Employés affectés</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let p of projects">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.projectManager }}</td>
        <td>{{ p.status }}</td>
        <td class="actions">
        <button class="btn-action" (click)="openModal('edit', p)">Modifier</button>
        <button class="btn-delete">Supprimer</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Modal Ajouter -->
<div class="modal-layer" [class.open]="modalOpen">
  <div class="modal-box">
    <h3>Ajouter un projet</h3>

    <form>
      <input class="input" placeholder="Nom du projet" />
      <input class="input" placeholder="Chef de projet" />

      <select [(ngModel)]="selectedProject.projectManager" name="manager">
        <option *ngFor="let u of users" [ngValue]="u">{{ u.firstName }} {{ u.lastName }}</option>
      </select>

      <select [(ngModel)]="selectedProject.status" name="status">
        <option value="IN_PROGRESS">En cours</option>
        <option value="COMPLETED">Terminé</option>
        <option value="CANCELLED">Annulé</option>
        <option value="PLANNED">Planifié</option>
      </select>

      <div class="button-container">
        <button class="welcome-logout" type="submit">Enregistrer</button>
        <button type="button" class="btn-delete" (click)="closeModal()">Annuler</button>
      </div>
    </form>
  </div>
</div>
