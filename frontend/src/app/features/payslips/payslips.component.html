<div class="page-wrapper">

  <!-- Header interne -->
  <div class="glass-card welcome-card">
    <div class="welcome-left">
      <div>
        <h2 class="welcome-title">Fiches de paie</h2>
        <p class="welcome-sub">Connecté en tant que {{ username }}</p>
      </div>
    </div>
    <button class="welcome-logout" (click)="openModal()">+ Générer</button>
  </div>

  <!-- Tableau -->
  <div class="glass-card table-card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Employé</th>
        <th>Salaire (€)</th>
        <th>Prime (€)</th>
        <th>Déduction (€)</th>
        <th>Total (€)</th>
        <th>Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let p of payslips">
        <td>{{ p.id }}</td>
        <td>{{ p.employeNom }}</td>
        <td>{{ p.salaireBase }}</td>
        <td>{{ p.prime }}</td>
        <td>{{ p.deduction }}</td>
        <td>{{ p.total }}</td>
        <td class="actions">
          <button class="btn-action">Exporter PDF</button>
          <button class="btn-delete">Supprimer</button>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Modal -->
<div class="modal-layer" [class.open]="modalOpen">
  <div class="modal-box">
    <h3>Générer une fiche de paie</h3>

    <form>
      <input class="input" placeholder="Nom de l'employé" />
      <input class="input" type="number" placeholder="Salaire de base (€)" />

      <input class="input" type="number" placeholder="Prime (€)" value="0" />
      <input class="input" type="number" placeholder="Déduction (€)" value="0" />

      <button class="welcome-logout" style="margin-top:10px;">Enregistrer</button>
      <button type="button" class="btn-delete" style="margin-top:10px;" (click)="closeModal()">Annuler</button>
    </form>
  </div>
</div>
