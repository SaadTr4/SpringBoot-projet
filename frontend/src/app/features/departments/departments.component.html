<div class="page-wrapper">

  <!-- Carte de titre -->
  <div class="glass-card welcome-card">
    <div class="welcome-left">
      <div>
        <h2 class="welcome-title">Liste des départements</h2>
        <p class="welcome-sub">Connecté en tant que {{ username }}</p>
      </div>
    </div>

    <button class="welcome-logout" (click)="openAddModal()">+ Ajouter</button>
  </div>

  <!-- Tableau des départements -->
  <div class="glass-card table-card">
    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>Nom du département</th>
        <th>Chef</th>
        <th>Employés</th>
        <th>Actions</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let d of departments">
          <td>{{ d.id }}</td>
          <td>{{ d.name }}</td>
          <td>{{ d.head || '-' }}</td>
          <td>{{ d.nbEmployees || 0 }}</td>
          <td>
            <button class="btn-action" (click)="openAddModal()">Modifier</button>
            <button class="btn-delete" (click)="deleteDepartment(d.id!)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal d'ajout -->
<!-- Modal d'ajout -->
<div class="modal-layer" [class.open]="modalOpen">
  <div class="modal-box">
    <h3>Ajouter un département</h3>

    <form (ngSubmit)="saveDepartment()">
      <input class="input" placeholder="Nom du département" [(ngModel)]="newDepartment.name" name="name" required />
      <input class="input" placeholder="Code" [(ngModel)]="newDepartment.code" name="code" required />
      <input class="input" placeholder="Description" [(ngModel)]="newDepartment.description" name="description" />

      <div class="button-container">
        <button class="welcome-logout" type="submit">Enregistrer</button>
        <button type="button" class="btn-delete" (click)="closeModal()">Annuler</button>
      </div>
    </form>
  </div>
</div>

</div>
